[package]
name = "generate-image"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }
dotenvy = "0.15"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23.1"
thiserror = "2"
